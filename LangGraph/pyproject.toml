[project]
name = "agent"
version = "0.0.1"
description = "Starter template for making a new agent LangGraph."
authors = [
    { name = "William Fu-Hinthorn", email = "13333726+hinthornw@users.noreply.github.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.3.0",
    "langchain-core>=1.4.0",
    # Pinned exactly, unlike the rest: llm.py subclasses ChatDeepSeek and depends on
    # its message serialisation dropping `reasoning_content`, which tests/unit_tests/
    # test_llm.py asserts. Loosening this would let an upstream fix land silently.
    "langchain-deepseek==1.1.0",
    "langchain-mcp-adapters>=0.3.0",
    "langgraph>=1.2.0",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "typing-extensions>=4.0.0",
]


[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["langgraph.templates.agent", "agent"]
[tool.setuptools.package-dir]
"langgraph.templates.agent" = "src/agent"
"agent" = "src/agent"

[tool.pytest.ini_options]
markers = [
    "mcp: tests that require a running MCP server (lean-lsp-mcp)",
    "slow: tests that take a long time to run",
    "langsmith: tests that send traces to LangSmith",
]
filterwarnings = [
    "ignore::DeprecationWarning:_pytest.assertion.rewrite",
]


[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
# The agent modules use bare imports (``from config import ...``) because
# ``src/agent`` is placed on sys.path at runtime by the CLI and the test suite.
# Point mypy at the same directory so those imports resolve, instead of burying
# real type errors under a dozen ``import-not-found`` diagnostics.
mypy_path = "src/agent"
# Without this, every module is discovered twice — once as ``agent.tools`` (via
# the src/agent/__init__.py package chain) and once as ``tools`` (via mypy_path
# above) — and mypy bails out with "found twice under different module names".
# ``explicit_package_bases`` makes mypy use the mypy_path roots for names, which
# matches how the code is actually imported at runtime.
explicit_package_bases = true
python_version = "3.12"
# Treat untyped bodies permissively: the point of this config is to catch
# genuine narrowing/attribute mistakes, not to force annotations everywhere.
check_untyped_defs = true

[[tool.mypy.overrides]]
# ``src/agent/__init__.py`` is the package entrypoint and uses the *qualified*
# import style (``from agent.graph import ...``) because the LangGraph CLI puts
# ``src`` on sys.path and imports the ``agent`` package. Every other module uses
# the bare style (``from config import ...``) with ``src/agent`` on sys.path.
# mypy can only be rooted at one of the two, so the qualified reference from the
# package entrypoint is acknowledged here instead of being left as noise.
module = "agent.*"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.4.14",
    "mypy>=1.13.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.8.2",
]
